<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Novell Services Login</h2>
    <form action="">
        <label for="">Username:</label>
        <input type="text">
        <br>
        <br>

        <label for="">Password:</label>
        <input type="password">
        <br>
        <br>

        <label for="">City of:</label>
        <input type="text">
        <br>
        <br>

        <label for="">Employment:</label>
        <input type="text">
        <br>
        <br>

        <label for="">Web server:</label>
        <select name="" id="">
            <option value="">----Choose a server----</option>
            <option value="">server_1</option>
            <option value="">server_2</option>
        </select>
        <br>
        <br>

        <label for="">Please specify your role:</label>
        <input type="radio" name="a">admin
        <input type="radio" name="a">Engineer
        <input type="radio" name="a">Manager
        <input type="radio" name="a">Guest
        <br>
        <br>

        <label for="">Single Sign-on to the following:</label>
        <input type="checkbox">Mail
        <input type="checkbox">Playroll
        <input type="checkbox">Self-service
        <br>
        <br>

        <input type="button" value="Login">
        <input type="button" value="Reset">
    </form>
</body>
</html>
